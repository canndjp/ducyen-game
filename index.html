<style>

.kind{padding:.3em .9em;border-radius:99px;background:var(--red);letter-spacing:.06em}

.op.dim{opacity:.4}.op.no{border-color:var(--no)}
.show .op em{opacity:1}.show .op .pc{width:var(--w)}

.pm{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--gold)}.pm .cd2{font:800 40px var(--se)}
.po{display:grid;gap:10px;flex:1;min-height:0;grid-auto-rows:1fr}
.pb{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;border:3px solid var(--ln);background:linear-gradient(90deg,rgba(255,255,255,.12),rgba(255,255,255,.04));text-align:left;font-weight:700;font-size:17px;line-height:1.25;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pb b{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--gold);color:#2a0a18;font:800 20px var(--se)}.pb small{font-size:12px}
.pb:active{transform:scale(.97)}.pb.sel{border-color:var(--gold);background:rgba(255,215,106,.28)}.pb.hide{opacity:.15;pointer-events:none}.pb.off{pointer-events:none}.pb:not(.sel).off{opacity:.45}
.pb.ok{border-color:var(--ok);background:rgba(56,217,138,.3);opacity:1}.pb.no{border-color:var(--no);background:rgba(255,93,108,.25);opacity:1}
.rb{border-radius:20px;padding:18px;text-align:center;border:2px solid var(--ln);background:var(--gl)}.rb.ok{border-color:var(--ok);background:rgba(56,217,138,.2)}.rb.no{border-color:var(--no);background:rgba(255,93,108,.18)}.rb.me{border-color:var(--gold);background:rgba(255,215,106,.22);box-shadow:0 0 36px rgba(255,215,106,.5)}
.rb b{display:block;font:800 26px var(--se)}.rb span{color:var(--mu);font-size:14px}
.pbar{display:flex;flex-direction:column;gap:6px}
.spin{animation:pl .7s infinite alternate;font-size:54px;text-align:center}

<script>
/* Mini QR encoder (byte mode, ECC M, v1-10) */
function makeQR(text){
 const bytes=Array.from(new TextEncoder().encode(text));
 const ECC=[0,10,16,26,18,24,16,18,22,22,26],BLK=[0,1,1,1,2,2,4,4,4,5,5];
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
 let ver=1;for(;ver<=10;ver++){const cap=Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver];if(4+(ver<10?8:16)+bytes.length*8<=cap*8)break}
 if(ver>10)throw new Error('URL too long');
 const size=ver*4+17,nData=Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver];
 let bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
 put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
 put(0,Math.min(4,nData*8-bits.length));while(bits.length%8)bits.push(0);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
 for(let p=0xEC;data.length<nData;p^=0xEC^0x11)data.push(p);
 const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
 const deg=ECC[ver],div=Array(deg).fill(0);div[deg-1]=1;
 for(let i=0,root=1;i<deg;i++){for(let j=0;j<deg;j++){div[j]=mul(div[j],root);if(j+1<deg)div[j]^=div[j+1]}root=mul(root,2)}
 const rem=d=>{const r=Array(deg).fill(0);d.forEach(b=>{const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))});return r};
 const nb=BLK[ver],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),blocks=[];
 for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-deg+(i<ns?0:1));k+=d.length;const e=rem(d);if(i<ns)d.push(0);blocks.push(d.concat(e))}
 const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-deg||j>=ns)cw.push(b[i])});
 const M=Array.from({length:size},()=>Array(size).fill(false)),F=Array.from({length:size},()=>Array(size).fill(false));
 const sf=(x,y,v)=>{M[y][x]=v;F[y][x]=true},bit=(v,i)=>((v>>>i)&1)!=0;
 for(let i=0;i<size;i++){sf(6,i,i%2==0);sf(i,6,i%2==0)}
 const fin=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)sf(xx,yy,d!=2&&d!=4)}};
 fin(3,3);fin(size-4,3);fin(3,size-4);
 if(ver>1){const n=Math.floor(ver/7)+2,st=Math.ceil((ver*4+4)/(n*2-2))*2,pos=[6];for(let p=size-7;pos.length<n;p-=st)pos.splice(1,0,p);
  pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i==0&&j==0)||(i==0&&j==n-1)||(i==n-1&&j==0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}))}
 const fmt=m=>{const d=0<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412;
  for(let i=0;i<=5;i++)sf(8,i,bit(b,i));sf(8,7,bit(b,6));sf(8,8,bit(b,7));sf(7,8,bit(b,8));for(let i=9;i<15;i++)sf(14-i,8,bit(b,i));
  for(let i=0;i<8;i++)sf(size-1-i,8,bit(b,i));for(let i=8;i<15;i++)sf(8,size-15+i,bit(b,i));sf(8,size-8,true)};
 fmt(0);
 if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;for(let i=0;i<18;i++){const c=bit(b,i),a=size-11+i%3,q=Math.floor(i/3);sf(a,q,c);sf(q,a,c)}}
 let i=0;for(let right=size-1;right>=1;right-=2){if(right==6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)==0?size-1-v:v;if(!F[y][x]&&i<cw.length*8){M[y][x]=bit(cw[i>>>3],7-(i&7));i++}}}
 const cond=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
 const mk=m=>{const g=M.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&cond[m](x,y))g[y][x]=!g[y][x];return g};
 const pen=g=>{let p=0;const run=l=>{let c=1;for(let k=1;k<=size;k++){if(k<size&&l[k]==l[k-1])c++;else{if(c>=5)p+=c-2;c=1}}};
  for(let y=0;y<size;y++){run(g[y]);run(g.map(r=>r[y]))}
  for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++)if(g[y][x]==g[y][x+1]&&g[y][x]==g[y+1][x]&&g[y][x]==g[y+1][x+1])p+=3;
  let d=0;g.forEach(r=>r.forEach(v=>d+=v));p+=Math.floor(Math.abs(d*20-size*size*10)/(size*size))*10;return p};
 let best=0,bp=1e9;for(let m=0;m<8;m++){const p=pen(mk(m));if(p<bp){bp=p;best=m}}
 fmt(best);const g=mk(best);
 let path='';g.forEach((r,y)=>r.forEach((v,x)=>{if(v)path+=`M${x+4},${y+4}h1v1h-1z`}));
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size+8} ${size+8}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
}

/* ---------- Kết nối dữ liệu (Firebase hoặc DEMO cục bộ) ---------- */
let DB,offset=0;
const now=()=>Date.now()+offset;
function initDB(cb){
  if(FIREBASE_CONFIG){
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const load=u=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=base+u;s.onload=ok;s.onerror=ko;document.head.append(s)});
    load('firebase-app-compat.js').then(()=>load('firebase-database-compat.js')).then(()=>{
      firebase.initializeApp(FIREBASE_CONFIG);const d=firebase.database(),root=d.ref('rooms/'+ROOM);
      d.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);
      DB={mode:'firebase',set:(p,v)=>root.child(p).set(v),update:(p,v)=>root.child(p).update(v),
        reset:()=>root.set(null),
        on:(p,f)=>{const r=root.child(p),h=s=>f(s.val());r.on('value',h);return()=>r.off('value',h)}};
      cb()}).catch(()=>{document.body.innerHTML='<p style="padding:30px;font:18px sans-serif">Không kết nối được Firebase. Kiểm tra mạng và cấu hình.</p>'});
  }else{
    const KEY='dy_demo_'+ROOM;let data={},L=[];try{data=JSON.parse(localStorage[KEY]||'{}')}catch(e){}
    const res=v=>{if(v&&typeof v=='object'){if(v['.sv']=='timestamp')return Date.now();for(const k in v)v[k]=res(v[k])}return v};
    const at=p=>p.split('/').filter(Boolean).reduce((o,k)=>o==null?o:o[k],data);
    const setAt=(p,v)=>{const ks=p.split('/').filter(Boolean);if(!ks.length){data=v||{};return}let o=data;ks.slice(0,-1).forEach(k=>o=o[k]=o[k]&&typeof o[k]=='object'?o[k]:{});if(v==null)delete o[ks.at(-1)];else o[ks.at(-1)]=v};
    const fire=()=>L.forEach(l=>{const j=JSON.stringify(at(l.p)??null);if(j!==l.j){l.j=j;l.f(JSON.parse(j))}});
    const save=()=>{try{localStorage[KEY]=JSON.stringify(data)}catch(e){}fire()};
    addEventListener('storage',e=>{if(e.key==KEY){try{data=JSON.parse(e.newValue||'{}')}catch(x){data={}}fire()}});
    DB={mode:'demo',set:(p,v)=>{setAt(p,res(JSON.parse(JSON.stringify(v??null))));save();return Promise.resolve()},
      update:(p,v)=>{v=res(JSON.parse(JSON.stringify(v)));for(const k in v)setAt(p+'/'+k,v[k]);save();return Promise.resolve()},
      reset:()=>{data={};save();return Promise.resolve()},
      on:(p,f)=>{const l={p,f,j:undefined};L.push(l);setTimeout(()=>{const j=JSON.stringify(at(p)??null);l.j=j;f(JSON.parse(j))});return()=>{L=L.filter(x=>x!==l)}}};
    cb();
  }
}

let AC;const tone=(f,d=.2,t=0,v=.07,ty='sine')=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=f;o.connect(g);g.connect(AC.destination);const s=AC.currentTime+t;g.gain.setValueAtTime(v,s);g.gain.exponentialRampToValueAtTime(.001,s+d);o.start(s);o.stop(s+d)}catch(e){}};
const chime=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.35,i*.1,.08));
const buzz=()=>[200,150].forEach((f,i)=>tone(f,.25,i*.15,.08,'sawtooth'));
const cv=$('#fx'),cx=cv.getContext('2d');let FX=[];
function rs(){cv.width=innerWidth;cv.height=innerHeight}rs();onresize=rs;
function confetti(n=160,x=innerWidth/2,y=innerHeight*.35){for(let i=0;i<n;i++){const a=Math.random()*6.28,s=4+Math.random()*10;FX.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:3+Math.random()*5,c:`hsl(${Math.random()*360},90%,65%)`,l:140+Math.random()*80})}loop()}
let raf;function loop(){cancelAnimationFrame(raf);cx.clearRect(0,0,cv.width,cv.height);FX=FX.filter(p=>p.l-->0);FX.forEach(p=>{p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.vx*=.99;cx.fillStyle=p.c;cx.globalAlpha=Math.min(1,p.l/40);cx.fillRect(p.x,p.y,p.r,p.r*1.6)});cx.globalAlpha=1;if(FX.length)raf=requestAnimationFrame(loop)}

function host(){
  let players={},answers={},results={},S={phase:'lobby',qi:-1},used={f:0,a:0,c:0},audOn=0,manual=0,timer=0,botsOn=0,bots=[],lastKey='',auto=0;
  const app=$('#app');
  const scores=()=>{const s={M:0,F:0};arr(results).forEach(r=>{if(r&&r.team)s[r.team]+=r.pts||0});return s};
  const plist=()=>Object.entries(players||{}).filter(([k,v])=>v&&v.team).map(([k,v])=>({pid:k,...v}));
  const valid=()=>{const q=Q[S.qi];if(!q)return[];return Object.entries(answers[S.qi]||{}).filter(([pid,x])=>players[pid]&&x&&x.ts<=S.startTs+S.dur*1000+1500&&!(arr(S.hide).includes(x.o))).map(([pid,x])=>({pid,o:x.o,ms:Math.max(0,x.ts-S.startTs),p:players[pid]}))};

  DB.on('players',v=>{players=v||{};live()});
  DB.on('answers',v=>{answers=v||{};live()});
  DB.on('results',v=>{results=v||{};chips()});
  DB.on('state',v=>{const prev=S;S=v||{phase:'lobby',qi:-1};const k=S.phase+'|'+S.qi+'|'+(arr(S.hide).join())+'|'+(S.pick??'');
    if(k!==lastKey){lastKey=k;if(S.phase=='q'&&prev.qi!==S.qi){audOn=0;botGo()}if(S.phase=='q'&&prev.phase!='q'&&!timer)tick0();render()}else live()});

  function chips(){const s=scores();['M','F'].forEach(t=>{const e=$('#sc'+t);if(e&&e.textContent!=fmt(s[t])){e.textContent=fmt(s[t]);e.parentElement.classList.add('bump');setTimeout(()=>e.parentElement.classList.remove('bump'),400)}})}
  const head=()=>{const s=scores();return`<div class="hd"><div class="brand">AI LÀ TRIỆU PHÚ<small>大富豪 · Đức ♥ Yến</small></div><div class="chips">
    <div class="chip m">${TEAM.M.ic} ${TEAM.M.n} <b id="scM">${fmt(s.M)}</b></div><div class="chip f">${TEAM.F.ic} ${TEAM.F.n} <b id="scF">${fmt(s.F)}</b></div></div></div>`};
  const modeTag=()=>DB.mode=='demo'?'<div class="mode">⚠ CHẾ ĐỘ DEMO: chưa gắn Firebase, chỉ chơi được trong cùng 1 trình duyệt</div>':'';

  function ctlBar(){
    const ph=S.phase,q=Q[S.qi];
    const main={lobby:'▶ Bắt đầu (Space)',q:'⏭ Chốt đáp án (Space)',locked:(q&&q.a==null&&S.pick==null)?'⬆ Chọn đáp án thật':'🎯 Lộ đáp án (Space)',reveal:S.qi>=Q.length-1?'🏁 Tổng kết (Space)':'▶ Câu tiếp (Space)',final:''}[ph];
    return`<div class="ctl">${main?`<button class="btn go" id="mainb" ${(ph=='locked'&&q&&q.a==null&&S.pick==null)?'disabled':''}>${main}</button>`:''}
      ${ph=='q'?`<button class="btn" id="l50" ${used.f||!q||q.o.length<3?'disabled':''}>50:50 (F)</button><button class="btn" id="lau" ${used.a?'disabled':''}>👥 Hỏi khán giả (A)</button><button class="btn" id="lca" ${used.c?'disabled':''}>📞 Gọi người thân (C)</button>`:''}
      <span class="sp"></span>
      ${ph=='reveal'?`<span class="hint">Chấm tay:</span><button class="btn m" data-aw="M">+ Nam</button><button class="btn f" data-aw="F">+ Nữ</button>`:''}
      <button class="btn" id="bbots">🤖 Bot thử (B)</button><button class="btn" id="bfin">🏁 Kết thúc (End)</button><button class="btn" id="brst">♻ Reset (R)</button></div>`}

  function render(){
    clearTimeout(auto);auto=0;const ph=S.phase;
    if(ph=='lobby')renderLobby();else if(ph=='final')renderFinal();else renderQ();
    wire();live();
  }
  function wire(){
    const g=id=>document.getElementById(id);
    g('mainb')&&(g('mainb').onclick=adv);g('l50')&&(g('l50').onclick=l50);g('lau')&&(g('lau').onclick=lau);g('lca')&&(g('lca').onclick=lca);
    g('bbots')&&(g('bbots').onclick=addBots);g('bfin')&&(g('bfin').onclick=toFinal);g('brst')&&(g('brst').onclick=reset);
    document.querySelectorAll('[data-aw]').forEach(b=>b.onclick=()=>award(b.dataset.aw));
    document.querySelectorAll('[data-pick]').forEach(b=>b.onclick=()=>pick(+b.dataset.pick));
  }

  function renderLobby(){
    const url=location.origin+location.pathname;
    app.innerHTML=`<div class="h">${head()}<div class="lob"><div class="qrb">${makeQR(url)}</div><div class="lobr">
      <h1>Quét QR để vào chơi!<small>QRコードを読み取って参加！</small></h1>
      <p>Chọn <b class="nam">Đội Nam</b> hoặc <b class="nu">Đội Nữ</b>, cùng trả lời, ai <b class="gold">đúng và nhanh nhất</b> ăn điểm cho đội!</p>
      <div class="url">${esc(url)}</div>
      <div class="tms"><div class="tm m"><h3>${TEAM.M.ic} ${TEAM.M.n} · <span id="cM">0</span></h3><div class="nm" id="nM"></div></div><div class="tm f"><h3>${TEAM.F.ic} ${TEAM.F.n} · <span id="cF">0</span></h3><div class="nm" id="nF"></div></div></div>
    </div></div>${ctlBar()}${modeTag()}</div>`;
  }
  let shown={};
  function live(){
    const ph=S.phase;
    if(ph=='lobby'){const pl=plist();['M','F'].forEach(t=>{const l=pl.filter(p=>p.team==t),box=$('#n'+t);if(!box)return;$('#c'+t).textContent=l.length;
      const key=t+l.map(p=>p.pid).join();if(shown[t]!==key){shown[t]=key;box.innerHTML=l.slice(-60).map(p=>`<i>${esc(p.name)}</i>`).join('')}})}
    if(ph=='q'||ph=='locked'){const v=valid(),n=plist().length;const e=$('#live');
      if(e&&!audOn){const m=v.filter(x=>x.p.team=='M').length,f=v.length-m;e.innerHTML=`✍ <b>${v.length}</b>/${n} đã trả lời · <span class="nam">${TEAM.M.ic} ${m}</span> · <span class="nu">${TEAM.F.ic} ${f}</span>`}
      if(audOn&&e)audBars(v);
      if(ph=='q'&&n>0&&v.length>=n&&!auto){auto=setTimeout(()=>{auto=0;if(S.phase=='q')lock()},1300)}}
  }
  function audBars(v){const q=Q[S.qi],e=$('#live');const c=q.o.map((_,i)=>v.filter(x=>x.o===i).length),t=v.length||1;
    e.innerHTML=`<div class="aud">${q.o.map((o,i)=>arr(S.hide).includes(i)?'':`<div style="height:${Math.max(3,c[i]/t*100)}%"><span>${Math.round(c[i]/t*100)}%</span><u>${'ABCD'[i]}</u></div>`).join('')}</div>`}

  function ladder(){let h='';for(let i=0;i<LAD.length;i++){const cur=stepOf(S.qi);h+=`<div class="${i==cur?'now':i<cur?'past':''}"><span>${i+1}</span><span>${fmt(LAD[i])}</span></div>`}return h}
  function renderQ(){
    const q=Q[S.qi],ph=S.phase,rv=ph=='reveal',hid=arr(S.hide);
    const n=q.o.length,cls=n==2?'n2':n==3?'n3':'';
    const dist=arr(S.dist);
    app.innerHTML=`<div class="h">${head()}<div class="mn"><div class="qa ${rv?'show':''}">
      <div class="meta"><span class="kind">${q.k}</span><span>Câu ${S.qi+1}/${Q.length}</span><span class="pts">💰 ${fmt(S.pts)} xu tình yêu</span><span class="cd" id="cd">${rv?'':S.dur}</span></div>
      <div class="bar"><i id="bar"></i></div>
      <h2 class="qt">${bi(q.q)}</h2>
      <div class="ops ${cls}">${q.o.map((o,i)=>`<div class="op ${hid.includes(i)?'hide':''} ${rv?(i===S.correct?'ok':'dim'):''}" style="--w:${S.total?Math.round((dist[i]||0)/S.total*100):0}%"><div class="pc"></div><b>${'ABCD'[i]}</b><span>${bi(o)}</span><em>${rv?`${S.total?Math.round((dist[i]||0)/S.total*100):0}% · ${dist[i]||0}`:''}</em></div>`).join('')}</div>
      <div class="live" id="live"></div>
      ${ph=='locked'&&q.a==null&&S.pick==null?`<div class="ctl" style="justify-content:center"><span class="hint">Đáp án thật là…</span><button class="btn go" data-pick="0">👨 Đức (D)</button><button class="btn go" data-pick="1">👩 Yến (Y)</button></div>`:''}
      ${rv?resultHTML():''}
      ${!rv&&q.tip?`<div class="hint" style="text-align:center;font-size:12px">💡 Mẹo MC: ${esc(q.tip)}</div>`:''}
    </div><div class="lad">${ladder()}</div></div>${ctlBar()}${modeTag()}</div>`;
    if(ph=='q')tick();
    if(ph=='locked'){$('#cd').textContent='⏹';$('#bar').style.width='0'}
    if(rv)setTimeout(()=>{const s=scores(),mx=Math.max(1,s.M,s.F);['M','F'].forEach(t=>{const b=$('#sb'+t);if(b)b.style.width=Math.max(4,s[t]/mx*100)+'%'})},60);
  }
  function resultHTML(){
    const w=S.winner,s=scores(),mx=Math.max(1,s.M,s.F),top=arr(S.top);
    return`<div class="res"><div class="win">${w?`<h3>⚡ Nhanh nhất: ${esc(w.name)} ${TEAM[w.team].ic}</h3><div class="t">${TEAM[w.team].n} · ${(w.ms/1000).toFixed(2)} giây → <b class="gold">+${fmt(S.pts)} xu</b> cho đội!</div>
      ${top.length>1?`<div class="t">Tiếp theo: ${top.slice(1).map(x=>`${esc(x.name)} ${(x.ms/1000).toFixed(2)}s`).join(' · ')}</div>`:''}`:`<h3>😅 ${S.manualAw?'Chấm tay':'Không ai trả lời đúng!'}</h3><div class="t">Chưa có đội nào được điểm câu này.</div>`}
      ${S.okN!=null?`<div class="t">✅ ${S.okN}/${S.total} người trả lời đúng</div>`:''}
      ${Q[S.qi].n?`<div class="n">${Q[S.qi].n}</div>`:''}</div>
      <div class="sc"><div class="sb m"><i id="sbM"></i><div class="w"><span>${TEAM.M.ic} ${TEAM.M.n}</span><span>${fmt(s.M)}</span></div></div><div class="sb f"><i id="sbF"></i><div class="w"><span>${TEAM.F.ic} ${TEAM.F.n}</span><span>${fmt(s.F)}</span></div></div></div></div>`;
  }

  /* --- đếm ngược --- */
  function tick0(){clearInterval(timer);timer=setInterval(tick,200)}
  function tick(){
    if(S.phase!='q'){clearInterval(timer);timer=0;return}
    const left=Math.max(0,S.dur-(now()-S.startTs)/1000),e=$('#cd'),b=$('#bar');
    if(e){const c=Math.ceil(left);if(e.textContent!=c){e.textContent=c;if(c<=5&&c>0)tone(880,.1,0,.05);}e.classList.toggle('lo',left<=5)}
    if(b)b.style.width=(left/S.dur*100)+'%';
    if(left<=0)lock();
  }

  /* --- luồng chơi --- */
  function startQ(i){
    const q=Q[i];used_reset();
    DB.set('state',{phase:'q',qi:i,n:Q.length,pts:ptsOf(i),dur:q.dur||20,startTs:TS,kind:q.k,text:q.q,opts:q.o,hide:null,pick:null,
      correct:null,winner:null,dist:null,top:null,total:null,okN:null,manualAw:null,scores:scores(),ver:Date.now()});
    tone(440,.2,0,.08);tone(660,.3,.15,.08);
  }
  function used_reset(){}
  function lock(){if(S.phase!='q')return;clearTimeout(auto);DB.update('state',{phase:'locked'});buzz()}
  function pick(i){DB.update('state',{pick:i})}
  function reveal(c){
    const v=valid(),ok=v.filter(x=>x.o===c).sort((a,b)=>a.ms-b.ms),w=ok[0],dist=Q[S.qi].o.map((_,i)=>v.filter(x=>x.o===i).length);
    const res=w?{pid:w.pid,name:w.p.name,team:w.p.team,ms:w.ms,pts:S.pts,ok:ok.map(x=>x.pid)}:{pid:'-',name:'',team:'',ms:0,pts:0};
    results=Array.isArray(results)?Object.assign({},results):(results||{});results[S.qi]=res;
    DB.set('results/'+S.qi,res);const sc=scores();
    DB.update('state',{phase:'reveal',correct:c,winner:w?{pid:w.pid,name:w.p.name,team:w.p.team,ms:w.ms}:null,
      top:ok.slice(0,3).map(x=>({name:x.p.name,ms:x.ms})),dist,total:v.length,okN:ok.length,scores:sc,manualAw:null});
    setTimeout(()=>{w?chime():buzz();if(w)confetti(90,innerWidth*.35,innerHeight*.7)},400);
  }
  function award(t){
    const res={pid:'-',name:'MC',team:t,ms:0,pts:S.pts,ok:[]};results=Object.assign({},results);results[S.qi]=res;
    DB.set('results/'+S.qi,res);DB.update('state',{winner:{pid:'-',name:'MC chấm tay',team:t,ms:0},manualAw:1,scores:scores()});chime();confetti(70);
  }
  function adv(){
    const ph=S.phase,q=Q[S.qi];
    if(ph=='lobby'){startQ(0)}
    else if(ph=='q')lock();
    else if(ph=='locked'){const c=q.a==null?S.pick:q.a;if(c==null||c<0)return;reveal(c)}
    else if(ph=='reveal'){S.qi>=Q.length-1?toFinal():startQ(S.qi+1)}
  }
  function toFinal(){if(S.phase=='final')return;DB.update('state',{phase:'final',scores:scores(),qi:Math.max(S.qi,0),ver:Date.now()})}
  function reset(){if(!confirm('Xóa toàn bộ người chơi và điểm để chơi lại từ đầu?'))return;used={f:0,a:0,c:0};bots=[];botsOn=0;DB.reset().then(()=>{})}

  /* --- quyền trợ giúp --- */
  function l50(){const q=Q[S.qi];if(S.phase!='q'||used.f||q.o.length<3)return;used.f=1;const wr=q.o.map((_,i)=>i).filter(i=>i!==q.a).sort(()=>Math.random()-.5).slice(0,2);DB.update('state',{hide:wr});tone(700,.2);}
  function lau(){if(S.phase!='q'||used.a)return;used.a=1;audOn=1;render();audBars(valid())}
  function lca(){if(S.phase!='q'||used.c)return;used.c=1;const d=document.createElement('div');d.className='ov';let t=30;d.innerHTML='📞 Gọi người thân!<small>Mời Đức, Yến hoặc một vị khách lên tư vấn</small><div class="big gold" id="ct">30</div>';document.body.append(d);
    const iv=setInterval(()=>{t--;const e=$('#ct');if(e)e.textContent=t;if(t<=0||S.phase!='q'){clearInterval(iv);d.remove()}},1000);d.onclick=()=>{clearInterval(iv);d.remove()};render()}

  /* --- tổng kết --- */
  function renderFinal(){
    const s=scores(),rs=arr(results).filter(r=>r&&r.team),st={};
    rs.forEach(r=>{if(r.pid&&r.pid!='-'){st[r.pid]=st[r.pid]||{w:0,c:0};st[r.pid].w++}arr(r.ok).forEach(p=>{st[p]=st[p]||{w:0,c:0};st[p].c++})});
    const mv=Object.entries(st).map(([pid,x])=>({...x,p:players[pid]})).filter(x=>x.p).sort((a,b)=>b.w-a.w||b.c-a.c).slice(0,5);
    const win=s.M==s.F?null:s.M>s.F?'M':'F',T=win&&TEAM[win];
    app.innerHTML=`<div class="h">${head()}<div class="fin">
      <div class="gold" style="font-size:clamp(14px,1.8vw,26px);letter-spacing:.3em">KẾT QUẢ CHUNG CUỘC · 最終結果</div>
      <h1>${T?`${T.ic} ${T.n.toUpperCase()}<br><span class="gold">LÀ TRIỆU PHÚ!</span>`:'🤝 HAI ĐỘI HÒA NHAU!<br><span class="gold">CÙNG LÀ TRIỆU PHÚ!</span>'}</h1>
      <div class="row"><div class="big nam">${TEAM.M.ic} ${TEAM.M.n}<br>${fmt(s.M)} xu<small>${TEAM.M.jp}</small></div><div class="big nu">${TEAM.F.ic} ${TEAM.F.n}<br>${fmt(s.F)} xu<small>${TEAM.F.jp}</small></div></div>
      ${mv.length?`<div class="mvp"><h3>🏅 Top nhanh tay · MVP</h3>${mv.map((x,i)=>`<div><span>${['🥇','🥈','🥉','4.','5.'][i]} ${esc(x.p.name)} ${TEAM[x.p.team].ic}</span><span class="hint">${x.w} lần nhanh nhất · ${x.c} câu đúng</span></div>`).join('')}</div>`:''}
    </div>${ctlBar()}${modeTag()}</div>`;
    setTimeout(()=>{chime();confetti(220);setTimeout(()=>confetti(160,innerWidth*.2,innerHeight*.4),500);setTimeout(()=>confetti(160,innerWidth*.8,innerHeight*.4),900)},300);
  }

  /* --- bot để thử --- */
  const BN=['Minh','Lan','Hùng','Mai','Tuấn','Hoa','Nam','Linh','Bảo','Thảo','Sơn','Vy','Khoa','Ngọc','Long','Chi','Duy','An','Huy','Trang'];
  function addBots(){const k=bots.length;for(let i=0;i<10;i++){const pid='bot'+(k+i);bots.push(pid);DB.set('players/'+pid,{name:'🤖'+BN[(k+i)%BN.length],team:i%2?'F':'M',t:TS})}botsOn=1}
  function botGo(){if(!botsOn)return;const q=Q[S.qi],qi=S.qi;bots.forEach(pid=>setTimeout(()=>{if(S.phase!='q'||S.qi!==qi)return;const know=Math.random()<.65&&q.a!=null;let o=know?q.a:Math.floor(Math.random()*q.o.length);DB.set('answers/'+qi+'/'+pid,{o,ts:TS})},800+Math.random()*(q.dur*1000*.7)))}

  document.addEventListener('keydown',e=>{
    if(e.target.tagName=='INPUT')return;const k=e.key;
    if(k==' '||k=='Enter'||k=='ArrowRight'){e.preventDefault();adv()}
    else if(k=='f'||k=='F')l50();else if(k=='a'||k=='A')lau();else if(k=='c'||k=='C')lca();
    else if(k=='b'||k=='B')addBots();else if(k=='End')toFinal();else if(k=='r'||k=='R')reset();
    else if((k=='d'||k=='D')&&S.phase=='locked'&&Q[S.qi].a==null)pick(0);else if((k=='y'||k=='Y')&&S.phase=='locked'&&Q[S.qi].a==null)pick(1);
  });
  render();
}

/* =====================================================================
   TRANG ĐIỆN THOẠI KHÁCH
   ===================================================================== */
function player(){
  const MEK='dy_me'+(P.get('as')||'');const app=$('#app');let me;try{me=JSON.parse(localStorage[MEK]||'null')}catch(e){}
  let S={phase:'lobby'},my=null,myTs=null,off=null,teamSel=null,sc={M:0,F:0},cdI=0;
  DB.on('state',v=>{const p=S;S=v||{phase:'lobby'};if(S.qi!==p.qi||S.phase=='q'&&p.phase!='q'){my=null;myTs=null;off&&off();off=null;if(me&&S.qi>=0)off=DB.on('answers/'+S.qi+'/'+me.pid,a=>{if(a&&a.ts){myTs=a.ts;if(my==null)my=a.o;if(S.phase=='reveal')render()}})}
    if(S.phase=='q'&&p.phase!='q'&&navigator.vibrate)navigator.vibrate(40);
    if(S.scores)sc={M:S.scores.M||0,F:S.scores.F||0};
    if(me&&S.phase=='lobby'&&S.qi==null){}
    render()});
  function bar(){return`<div class="pt"><span class="who ${TEAM[me.team].c}">${TEAM[me.team].ic} ${esc(me.name)}</span><span class="sc2"><span class="m">💙 ${fmt(sc.M)}</span><span class="f">💖 ${fmt(sc.F)}</span></span></div>`}
  function join(){
    app.innerHTML=`<div class="p"><div class="pc2"><div style="text-align:center;font-size:44px">💍</div><h1>AI LÀ TRIỆU PHÚ<small style="font-family:var(--sa);font-size:13px;color:var(--mu)">Đức ♥ Yến · 大富豪</small></h1>
      <input class="inp" id="nm" maxlength="14" placeholder="Tên của bạn · お名前" autocomplete="off" value="${esc(me&&me.name||'')}">
      <div class="tb"><button class="tbn m ${teamSel=='M'?'on':''}" data-t="M">💙<br>Đội Nam<br><small>男性チーム</small></button><button class="tbn f ${teamSel=='F'?'on':''}" data-t="F">💖<br>Đội Nữ<br><small>女性チーム</small></button></div>
      <button class="go2" id="go" disabled>Vào chơi · 参加する</button></div></div>`;
    const nm=$('#nm'),go=$('#go'),chk=()=>go.disabled=!(nm.value.trim()&&teamSel);nm.oninput=chk;chk();
    document.querySelectorAll('.tbn').forEach(b=>b.onclick=()=>{teamSel=b.dataset.t;document.querySelectorAll('.tbn').forEach(x=>x.classList.toggle('on',x===b));chk()});
    go.onclick=()=>{const pid=(me&&me.pid)||('p'+Math.random().toString(36).slice(2,9));me={pid,name:nm.value.trim().slice(0,14),team:teamSel};try{localStorage[MEK]=JSON.stringify(me)}catch(e){}
      DB.set('players/'+pid,{name:me.name,team:me.team,t:TS});S.qi!=null&&S.qi>=0&&off==null&&(off=DB.on('answers/'+S.qi+'/'+pid,a=>{if(a&&a.ts){myTs=a.ts;if(my==null)my=a.o}}));watchMe();render()};
  }
  let wm=0;function watchMe(){if(wm)return;wm=1;DB.on('players/'+me.pid,v=>{if(!v&&me)DB.set('players/'+me.pid,{name:me.name,team:me.team,t:TS})})}
  function render(){
    clearInterval(cdI);
    if(!me){join();return}
    const ph=S.phase;
    if(ph=='lobby'||S.qi==null||S.qi<0){app.innerHTML=`<div class="p">${bar()}<div class="pc2"><div class="spin">⏳</div><h2>Đã vào phòng!<small style="font-family:var(--sa);font-size:13px;color:var(--mu)">参加完了！</small></h2><p>Chờ MC bắt đầu nhé.<br>Hãy nhìn lên màn hình lớn 👀</p></div></div>`;return}
    if(ph=='final'){const s=sc,w=s.M==s.F?null:s.M>s.F?'M':'F',mine=w&&w==me.team;
      app.innerHTML=`<div class="p">${bar()}<div class="pc2"><div style="text-align:center;font-size:70px">${w?(mine?'🏆':'🎖️'):'🤝'}</div><h1>${w?`${TEAM[w].n} chiến thắng!<small style="display:block;font:13px var(--sa);color:var(--mu);margin-top:6px">${TEAM[w].jp}の勝利！</small>`:'Hai đội hòa nhau!'}</h1>
      <div class="rb ${mine?'me':''}"><b>💙 ${fmt(s.M)} · 💖 ${fmt(s.F)}</b><span>${mine?'Đội của bạn là TRIỆU PHÚ! 🎉':'Cảm ơn bạn đã chơi cùng Đức & Yến ♥'}</span></div></div></div>`;
      if(mine)confetti(160);return}
    const q=(S.text&&S.opts)?S:null;if(!q){return}
    const opts=arr(S.opts).map(o=>arr(o)),hid=arr(S.hide),txt=arr(S.text);
    const head=`<div class="pm"><span>Câu ${S.qi+1}/${S.n} · 💰 ${fmt(S.pts)}</span><span class="cd2" id="pcd"></span></div><div class="pq">${esc(txt[0])}${txt[1]?`<small>${esc(txt[1])}</small>`:''}</div>`;
    const btns=cls=>opts.map((o,i)=>`<button class="pb ${hid.includes(i)?'hide':''} ${cls(i)}" data-o="${i}"><b>${'ABCD'[i]}</b><span>${esc(o[0])}${o[1]?`<small style="display:block;color:var(--mu)">${esc(o[1])}</small>`:''}</span></button>`).join('');
    if(ph=='q'){
      app.innerHTML=`<div class="p">${bar()}${head}<div class="po">${btns(i=>my==null?'':(my===i?'sel off':'off'))}</div><p style="text-align:center;font-size:14px;color:var(--mu);min-height:1.4em" id="pst">${my==null?'Chạm vào đáp án thật nhanh! ⚡':'✅ Đã chốt! Chờ kết quả…'}</p></div>`;
      document.querySelectorAll('.pb').forEach(b=>b.onclick=()=>{if(my!=null||S.phase!='q')return;const o=+b.dataset.o;my=o;myTs=Date.now();navigator.vibrate&&navigator.vibrate(30);
        DB.set('answers/'+S.qi+'/'+me.pid,{o,ts:TS});document.querySelectorAll('.pb').forEach(x=>x.classList.add('off'));b.classList.add('sel');$('#pst').textContent='✅ Đã chốt! Chờ kết quả…'});
      const t=()=>{const l=Math.max(0,Math.ceil(S.dur-(now()-S.startTs)/1000));const e=$('#pcd');if(e)e.textContent=l};t();cdI=setInterval(t,250);return}
    if(ph=='locked'){app.innerHTML=`<div class="p">${bar()}${head}<div class="po">${btns(i=>my===i?'sel off':'off')}</div><p style="text-align:center;color:var(--gold);font-weight:800">${my==null?'⏰ Hết giờ rồi!':'🔒 Đã khóa · MC sắp lộ đáp án…'}</p></div>`;$('#pcd')&&($('#pcd').textContent='⏹');return}
    if(ph=='reveal'){
      const c=S.correct,right=my!=null&&my===c,w=S.winner,iAmW=w&&w.pid==me.pid,ms=(myTs&&S.startTs)?Math.max(0,myTs-S.startTs)/1000:null;
      const tw=w?TEAM[w.team]:null;
      app.innerHTML=`<div class="p">${bar()}${head}<div class="po" style="grid-auto-rows:auto">${btns(i=>i===c?'ok off':(my===i?'no off':'off'))}</div>
        <div class="rb ${iAmW?'me':right?'ok':'no'}">${iAmW?`<b>🏆 BẠN NHANH NHẤT! +${fmt(S.pts)}</b><span>${ms!=null?ms.toFixed(2)+' giây · ':''}điểm về ${TEAM[me.team].n}</span>`:right?`<b>🎉 Đúng rồi!</b><span>${ms!=null?ms.toFixed(2)+' giây':''}${w?` · nhanh nhất là ${esc(w.name)}`:''}</span>`:`<b>${my==null?'⏰ Không kịp trả lời':'😅 Sai rồi!'}</b><span>${w?`Nhanh nhất: ${esc(w.name)} ${tw.ic} (${(w.ms/1000).toFixed(2)}s)`:'Không ai đúng câu này'}</span>`}</div></div>`;
      if(iAmW){confetti(120,innerWidth/2,innerHeight*.5);navigator.vibrate&&navigator.vibrate([60,40,60])}
      return}
  }
  if(me)watchMe();render();
}

initDB(()=>HOST?host():player());
</script>
</body>
