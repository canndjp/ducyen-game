<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ai là triệu phú · Đức ♥ Yến</title>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Noto+Sans+JP:wght@500;700&family=Shippori+Mincho+B1:wght@500;800&display=swap" rel="stylesheet">
<style>:root{color-scheme:dark;--bg:#0a0612;--red:#ef0107;--gold:#ffd76a;--sk:#f4b6c8;--tx:#fff3f6;--mu:#c9a9b6;--gl:rgba(255,255,255,.07);--ln:rgba(255,255,255,.18);
--tm:#4db2ff;--tf:#ff7ab8;--ok:#38d98a;--no:#ff5d6c;--la:#ff8a5c;--lb:#b583ff;--ld:#38d98a;
--se:'Shippori Mincho B1',serif;--sa:'Be Vietnam Pro','Noto Sans JP',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--bg);color:var(--tx);font-family:var(--sa);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
small{display:block;font-weight:400;color:var(--mu);font-size:.62em;margin-top:.15em}
#bgl{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
#bgl i{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:drift 22s ease-in-out infinite alternate}
#bgl i:nth-child(1){width:55vmax;height:55vmax;left:-15vmax;top:-20vmax;background:radial-gradient(#7a1fa8,transparent 65%)}
#bgl i:nth-child(2){width:50vmax;height:50vmax;right:-18vmax;top:10vmax;background:radial-gradient(#b3123a,transparent 65%);animation-duration:28s;animation-delay:-8s}
#bgl i:nth-child(3){width:45vmax;height:45vmax;left:20vmax;bottom:-25vmax;background:radial-gradient(#1b4fa8,transparent 65%);animation-duration:34s;animation-delay:-14s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
#bg,#fx{position:fixed;inset:0;pointer-events:none;width:100%;height:100%}
#bg{z-index:1}#fx{z-index:50}
#app{position:relative;z-index:2}
.gold{color:var(--gold)}.nam{color:var(--tm)}.nu{color:var(--tf)}
.glass{background:linear-gradient(135deg,rgba(255,255,255,.1),rgba(255,255,255,.03));border:1px solid var(--ln);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}

/* ============ HOST ============ */
.h{height:100vh;display:flex;flex-direction:column;padding:1.2vh 2.2vw 1.4vh;gap:1.2vh}
.tug{position:relative;height:.9vh;border-radius:9px;background:linear-gradient(90deg,var(--tm),#fff 50%,var(--tf));opacity:.9;margin:0 -.4vw}
.tug i{position:absolute;inset:0 auto 0 0;width:50%;background:var(--tm);border-radius:9px;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.tug u{position:absolute;inset:0 0 0 auto;width:50%;background:var(--tf);border-radius:9px;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.tug b{position:absolute;top:50%;left:50%;width:2.2vh;height:2.2vh;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff,0 0 40px var(--gold);transform:translate(-50%,-50%);transition:left 1.2s cubic-bezier(.2,.9,.3,1)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:2vw}
.brand{font:800 clamp(18px,2.2vw,34px) var(--se);letter-spacing:.05em;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:inline;margin-left:.6em;-webkit-text-fill-color:var(--mu);letter-spacing:.1em;font-size:.4em}
.chips{display:flex;gap:1.2vw}
.chip{display:flex;align-items:baseline;gap:.6em;padding:.5vh 1.3vw;border-radius:99px;border:2px solid;background:rgba(10,6,18,.5);backdrop-filter:blur(10px);font-weight:800;font-size:clamp(14px,1.6vw,26px);transition:transform .35s}
.chip.m{border-color:var(--tm);color:var(--tm);box-shadow:0 0 24px rgba(77,178,255,.25)}.chip.f{border-color:var(--tf);color:var(--tf);box-shadow:0 0 24px rgba(255,122,184,.25)}
.chip b{font:800 1.3em var(--se);color:#fff}.chip.bump{transform:scale(1.16)}
.mn{flex:1;min-height:0;display:flex;gap:1.8vw}
.qa{flex:1;min-width:0;display:flex;flex-direction:column;gap:1.3vh;position:relative}
.meta{display:flex;align-items:center;gap:1.2vw;font-weight:800;font-size:clamp(13px,1.4vw,22px)}
.kind{padding:.35em 1em;border-radius:99px;background:linear-gradient(90deg,var(--red),#ff4d6d);letter-spacing:.05em;box-shadow:0 0 22px rgba(239,1,7,.45)}
.pts{color:var(--gold)}
.ring{margin-left:auto;position:relative;width:8.4vh;height:8.4vh}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:7;stroke-linecap:round}.ring .t{stroke:rgba(255,255,255,.12)}.ring .p{stroke:var(--gold);stroke-dasharray:289;stroke-dashoffset:0;transition:stroke-dashoffset .25s linear,stroke .3s;filter:drop-shadow(0 0 6px var(--gold))}
.ring.lo .p{stroke:var(--no);filter:drop-shadow(0 0 8px var(--no))}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:800 3.6vh var(--se);color:#fff}.ring.lo b{color:var(--no);animation:pl .5s infinite alternate}
@keyframes pl{to{transform:scale(1.18)}}
.qc{border-radius:24px;padding:2vh 2.2vw;text-align:center;position:relative;overflow:hidden}
.qc::before{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.08) 50%,transparent 70%);transform:translateX(-100%);animation:shine 3.5s ease-in-out .6s infinite}
@keyframes shine{to{transform:translateX(100%)}}
.qt{font:800 clamp(24px,3.5vw,58px)/1.25 var(--se);min-height:2.6em;display:flex;flex-direction:column;justify-content:center;animation:up .7s both}
.qt small{font-family:var(--sa);font-size:.48em;margin-top:.5em}
@keyframes up{from{opacity:0;transform:translateY(24px) scale(.97)}}
.ops{display:grid;grid-template-columns:1fr 1fr;gap:1.4vh 1.4vw}.ops.n2{grid-template-columns:1fr 1fr}.ops.n3{grid-template-columns:1fr}
.op{position:relative;display:flex;align-items:center;gap:1vw;padding:1.7vh 1.3vw;border-radius:18px;border:2px solid var(--ln);background:linear-gradient(90deg,rgba(255,255,255,.11),rgba(255,255,255,.035));font-weight:700;font-size:clamp(16px,2vw,32px);overflow:hidden;transition:.4s;animation:up .6s both;animation-delay:var(--d)}
.op b{flex:none;width:1.75em;height:1.75em;border-radius:50%;display:grid;place-items:center;color:#1d0a18;font-family:var(--se);font-size:.95em;position:relative;z-index:1}
.op:nth-child(1) b{background:var(--la);box-shadow:0 0 18px var(--la)}.op:nth-child(2) b{background:var(--lb);box-shadow:0 0 18px var(--lb)}.op:nth-child(3) b{background:var(--gold);box-shadow:0 0 18px var(--gold)}.op:nth-child(4) b{background:var(--ld);box-shadow:0 0 18px var(--ld)}
.op span{flex:1;position:relative;z-index:1;text-align:left}.op .pc{position:absolute;inset:0 auto 0 0;width:0;background:rgba(255,215,106,.25);transition:width 1s cubic-bezier(.2,.9,.3,1)}
.op em{position:relative;z-index:1;font:800 .85em var(--se);font-style:normal;color:var(--gold);opacity:0;transition:.5s}
.op.hide{opacity:.1;filter:grayscale(1)}
.op.ok{border-color:var(--ok);background:rgba(56,217,138,.3);box-shadow:0 0 50px rgba(56,217,138,.55);transform:scale(1.025);animation:okp 1s ease-out}
@keyframes okp{0%{box-shadow:0 0 0 rgba(56,217,138,0)}40%{box-shadow:0 0 90px rgba(56,217,138,.9)}}
.op.dim{opacity:.38}
.show .op em{opacity:1}.show .op .pc{width:var(--w)}
.lanes{display:flex;flex-direction:column;gap:.6vh}
.lane{display:flex;align-items:center;gap:.8vw;min-height:4.4vh;padding:.3vh 1vw;border-radius:99px;border:1.5px solid;background:rgba(10,6,18,.4)}
.lane.m{border-color:rgba(77,178,255,.55)}.lane.f{border-color:rgba(255,122,184,.55)}
.lane>span{font-weight:800;font-size:clamp(11px,1.15vw,18px);min-width:6.2em}.lane.m>span{color:var(--tm)}.lane.f>span{color:var(--tf)}
.lane>div{flex:1;display:flex;flex-wrap:nowrap;gap:.35vw;overflow:hidden}
.lane>div i{font-style:normal;font-size:2.6vh;animation:pop .5s both}.lane>div em{font-style:normal;color:var(--mu);align-self:center}
.lane>b{font:800 1.4em var(--se)}
@keyframes pop{from{transform:scale(0) rotate(-40deg);opacity:0}}
.aud{display:flex;gap:1vw;justify-content:center;align-items:flex-end;height:10vh;margin-top:.4vh}.aud div{width:6vw;background:linear-gradient(0deg,var(--red),var(--gold));border-radius:8px 8px 0 0;position:relative;transition:height .6s;min-height:3px}.aud span{position:absolute;bottom:100%;left:0;right:0;text-align:center;font-weight:800;font-size:.9em}.aud u{position:absolute;top:100%;left:0;right:0;text-align:center;text-decoration:none;color:var(--gold);font-weight:800}
.lad{width:12vw;max-width:200px;display:flex;flex-direction:column-reverse;gap:.45vh;justify-content:center;font-weight:800;font-size:clamp(11px,1.1vw,17px)}
.lad div{display:flex;justify-content:space-between;padding:.35vh .7vw;border-radius:8px;color:var(--mu)}.lad div.now{background:linear-gradient(90deg,var(--gold),#ffb347);color:#2a0a18;box-shadow:0 0 30px rgba(255,215,106,.75);transform:scale(1.08)}.lad div.past{color:var(--ok)}.lad div:nth-child(5n){color:#fff}
.splash{position:absolute;inset:0;z-index:5;display:grid;place-items:center;pointer-events:none;animation:spl 1.7s both}
.splash div{font:800 clamp(60px,12vw,200px)/1 var(--se);text-align:center;background:linear-gradient(180deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 40px rgba(255,215,106,.7))}
.splash small{font:800 .22em var(--sa);-webkit-text-fill-color:var(--gold);letter-spacing:.2em}
@keyframes spl{0%{opacity:0;transform:scale(2.4);backdrop-filter:blur(14px)}25%{opacity:1;transform:scale(1)}70%{opacity:1}100%{opacity:0;transform:scale(.9)}}
.rvm .qt{min-height:0;font-size:clamp(20px,2.7vw,44px)}.rvm .qc{padding:1.2vh 2vw}.rvm .op{padding:1.1vh 1.2vw;font-size:clamp(14px,1.7vw,27px)}.rvm .ops{gap:1vh 1vw}
.rv{display:grid;grid-template-columns:1.1fr 1.2fr .9fr;gap:1.2vw}
.card{border-radius:18px;padding:1.2vh 1.2vw;font-size:clamp(12px,1.35vw,21px)}
.win{border-color:rgba(255,215,106,.7)!important;box-shadow:0 0 40px rgba(255,215,106,.18)}
.win h3{display:flex;align-items:center;gap:.5em;font:800 1.3em var(--se);color:var(--gold)}.win h3 i{font-style:normal;font-size:1.5em}
.win .t{color:var(--mu);margin-top:.4vh}.win .n{color:var(--sk);margin-top:.6vh;font-size:.9em;line-height:1.35}
.an h4,.win h4{font:800 .95em var(--sa);color:var(--gold);letter-spacing:.06em;margin-bottom:.6vh}
.an .row{display:flex;align-items:center;gap:.7vw;margin:.5vh 0}.an .row>span{min-width:5.2em;color:var(--mu)}
.an .bar2{flex:1;height:1.5vh;border-radius:9px;background:var(--gl);overflow:hidden}.an .bar2 i{display:block;height:100%;width:0;transition:width 1.2s cubic-bezier(.2,.9,.3,1)}
.an .m i{background:var(--tm)}.an .f i{background:var(--tf)}.an .all i{background:linear-gradient(90deg,var(--ok),var(--gold))}
.lv{display:inline-block;padding:.1em .8em;border-radius:99px;font-weight:800;background:var(--ok);color:#06210f}.lv.v2{background:var(--gold);color:#2a1d00}.lv.v3{background:#ff8a5c;color:#2a0d00}.lv.v4{background:var(--no);color:#fff}
.sc{display:flex;flex-direction:column;justify-content:center;gap:1vh}
.sb{height:4.6vh;border-radius:99px;background:var(--gl);overflow:hidden;position:relative}.sb i{display:block;height:100%;width:0;transition:width 1.4s cubic-bezier(.2,.9,.3,1)}.sb.m i{background:linear-gradient(90deg,#1b6fd1,var(--tm))}.sb.f i{background:linear-gradient(90deg,#d1336f,var(--tf))}
.sb .w{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 1.2vw;font-weight:800;font-size:clamp(12px,1.35vw,22px);text-shadow:0 1px 4px #000}
.botb{display:flex;align-items:center;gap:1vw;padding:1vh 1.4vw;border-radius:99px;font-size:clamp(13px,1.5vw,23px)}
.bav{flex:none;width:5.2vh;height:5.2vh;border-radius:50%;display:grid;place-items:center;font-size:3vh;background:linear-gradient(135deg,var(--sk),var(--lb));box-shadow:0 0 22px var(--sk);animation:bob 1.6s ease-in-out infinite alternate}
@keyframes bob{to{transform:translateY(-.5vh)}}
.botb small{margin:0;color:var(--sk);font-weight:800;letter-spacing:.14em;font-size:.55em}.botb p{line-height:1.3;min-height:1.3em}
.ctl{display:flex;gap:.7vw;align-items:center;flex-wrap:wrap;font-size:clamp(11px,1.05vw,15px)}
.btn{padding:.9vh 1.2vw;border-radius:12px;border:1px solid var(--ln);background:var(--gl);font-weight:700;font-size:inherit;transition:.2s}.btn:hover{background:rgba(255,255,255,.18);transform:translateY(-1px)}.btn[disabled]{opacity:.3;cursor:default;transform:none}
.btn.go{background:linear-gradient(90deg,var(--red),#ff4d6d);border-color:transparent;font-size:1.25em;padding:1.1vh 2vw;box-shadow:0 0 28px rgba(239,1,7,.6)}
.btn.m{border-color:var(--tm);color:var(--tm)}.btn.f{border-color:var(--tf);color:var(--tf)}
.sp{flex:1}.hint{color:var(--mu)}
.lob{flex:1;min-height:0;display:flex;gap:3vw;align-items:center}
.qrw{position:relative;flex:none}
.qrw::before,.qrw::after{content:'';position:absolute;inset:-14px;border-radius:34px;border:3px solid var(--gold);opacity:0;animation:ping 2.8s ease-out infinite}.qrw::after{animation-delay:1.4s}
@keyframes ping{0%{transform:scale(.96);opacity:.8}100%{transform:scale(1.14);opacity:0}}
.qrb{position:relative;background:#fff;padding:1.4vh;border-radius:24px;box-shadow:0 0 80px rgba(255,215,106,.4);width:min(44vh,34vw);aspect-ratio:1}.qrb svg{display:block;width:100%;height:100%}
.lobr{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;gap:1.3vh;justify-content:center}
.lobr h1{font:800 clamp(30px,4.6vw,76px)/1.1 var(--se);background:linear-gradient(90deg,#fff,var(--gold) 70%);-webkit-background-clip:text;background-clip:text;color:transparent}.lobr h1 small{-webkit-text-fill-color:var(--sk);font-family:var(--sa)}
.lobr p{color:var(--mu);font-size:clamp(14px,1.6vw,24px)}.url{font:700 clamp(12px,1.3vw,20px) monospace;color:var(--gold);word-break:break-all}
.cnt{font:800 clamp(18px,2.2vw,34px) var(--se);color:#fff}.cnt b{color:var(--gold);font-size:1.4em}
.tms{display:grid;grid-template-columns:1fr 1fr;gap:1.2vw;flex:1;min-height:0;max-height:36vh}
.tm{border-radius:20px;border:2px solid;padding:1.2vh 1.2vw;overflow:hidden;display:flex;flex-direction:column;gap:.8vh;background:rgba(10,6,18,.4)}.tm.m{border-color:var(--tm)}.tm.f{border-color:var(--tf)}
.tm h3{font:800 clamp(16px,1.9vw,30px) var(--se)}.tm.m h3{color:var(--tm)}.tm.f h3{color:var(--tf)}
.nm{display:flex;flex-wrap:wrap;gap:.5vh .5vw;overflow:hidden;align-content:flex-start}.nm i{font-style:normal;padding:.2em .8em .2em .5em;border-radius:99px;background:var(--gl);font-size:clamp(11px,1.15vw,18px);animation:pop .5s both}
.tip{min-height:2.6em;display:flex;align-items:center;gap:.8vw;padding:.8vh 1.2vw;border-radius:99px;font-size:clamp(12px,1.3vw,20px);color:var(--sk)}
.fin{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6vh;text-align:center}
.fin h1{font:800 clamp(34px,5.8vw,98px)/1.05 var(--se);animation:boom 1.6s both}@keyframes boom{from{transform:scale(2.6);opacity:0;filter:blur(18px)}60%{transform:scale(.95);filter:none}}
.fin .row{display:flex;gap:5vw;align-items:flex-start;justify-content:center;width:100%}
.big{font:800 clamp(24px,3.4vw,56px) var(--se)}.big small{font-family:var(--sa);font-size:.34em}
.fcol{display:grid;grid-template-columns:1.25fr 1fr;gap:1.6vw;width:min(92vw,1400px);text-align:left}
.aw{display:grid;grid-template-columns:1fr 1fr;gap:1vh 1vw}
.awc{border-radius:16px;padding:1.2vh 1vw;display:flex;gap:.8vw;align-items:center;animation:up .7s both;animation-delay:var(--d)}
.awc i{font-style:normal;font-size:4.4vh}.awc b{display:block;font:800 clamp(13px,1.45vw,22px) var(--sa)}.awc span{color:var(--gold);font-weight:700;font-size:clamp(11px,1.15vw,17px)}.awc small{margin:0}
.mvp{border-radius:16px;padding:1.2vh 1.4vw;font-size:clamp(13px,1.45vw,22px)}.mvp h3{font-family:var(--se);color:var(--gold);margin-bottom:.6vh}.mvp div{display:flex;gap:1vw;justify-content:space-between;padding:.28vh 0;border-bottom:1px dashed rgba(255,255,255,.1)}
.ov{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:20;padding:3vh 3vw;border-radius:24px;background:rgba(20,8,30,.96);border:3px solid var(--gold);font:800 clamp(20px,2.8vw,44px) var(--se);text-align:center;box-shadow:0 0 90px rgba(255,215,106,.5)}.ov small{font-family:var(--sa)}
.mode{position:fixed;left:50%;bottom:.6vh;transform:translateX(-50%);font-size:11px;color:var(--mu);z-index:9}

/* ============ PLAYER ============ */
.p{height:100dvh;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));gap:10px;max-width:520px;margin:0 auto;overflow-y:auto}
.pt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:13px}
.pt .who{display:flex;align-items:center;gap:6px;font-weight:800;padding:4px 12px 4px 6px;border-radius:99px;border:2px solid;background:rgba(10,6,18,.5)}.pt .who i{font-style:normal;font-size:20px}.pt .who.m{border-color:var(--tm);color:var(--tm)}.pt .who.f{border-color:var(--tf);color:var(--tf)}
.sc2{display:flex;gap:10px;font-weight:800}.sc2 .m{color:var(--tm)}.sc2 .f{color:var(--tf)}
.ptug{height:6px;border-radius:6px;background:var(--tf);overflow:hidden;flex:none}.ptug i{display:block;height:100%;width:50%;background:var(--tm);transition:width 1s}
.pc2{flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;justify-content:center}
.pc2 h1{font:800 30px/1.2 var(--se);text-align:center;background:linear-gradient(90deg,#fff,var(--gold));-webkit-background-clip:text;background-clip:text;color:transparent}.pc2 h2{font:800 21px/1.3 var(--se);text-align:center}.pc2 p{text-align:center;color:var(--mu);line-height:1.5}
.inp{width:100%;padding:14px;border-radius:14px;border:2px solid var(--ln);background:var(--gl);color:#fff;font:700 18px var(--sa);text-align:center}.inp:focus{outline:none;border-color:var(--gold)}
.avs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}.avb{aspect-ratio:1;border-radius:14px;border:2px solid var(--ln);background:var(--gl);font-size:26px;padding:0}.avb.on{border-color:var(--gold);background:rgba(255,215,106,.22);transform:scale(1.1)}
.tb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tbn{padding:16px 8px;border-radius:18px;border:3px solid var(--ln);background:var(--gl);font-weight:800;font-size:18px;line-height:1.3}.tbn small{font-size:12px}.tbn.m.on{border-color:var(--tm);background:rgba(77,178,255,.28);box-shadow:0 0 24px rgba(77,178,255,.4)}.tbn.f.on{border-color:var(--tf);background:rgba(255,122,184,.28);box-shadow:0 0 24px rgba(255,122,184,.4)}
.go2{padding:17px;border-radius:16px;border:0;background:linear-gradient(90deg,var(--red),#ff4d6d);font-weight:800;font-size:19px;box-shadow:0 0 24px rgba(239,1,7,.5)}.go2[disabled]{opacity:.35}
.pq{font:800 19px/1.35 var(--se);text-align:center;max-height:22vh;overflow:auto}.pq small{font-family:var(--sa)}
.pm{display:flex;justify-content:space-between;align-items:center;font-weight:800;color:var(--gold)}
.pring{position:relative;width:54px;height:54px;flex:none}.pring svg{width:100%;height:100%;transform:rotate(-90deg)}.pring circle{fill:none;stroke-width:7;stroke-linecap:round}.pring .t{stroke:rgba(255,255,255,.12)}.pring .p{stroke:var(--gold);stroke-dasharray:289;transition:stroke-dashoffset .25s linear}.pring.lo .p{stroke:var(--no)}

<script>/* Mini QR encoder (byte mode, ECC M, v1-10) */
function makeQR(text){
 const bytes=Array.from(new TextEncoder().encode(text));
 const ECC=[0,10,16,26,18,24,16,18,22,22,26],BLK=[0,1,1,1,2,2,4,4,4,5,5];
 const raw=v=>{let r=(16*v+128)*v+64;if(v>=2){const n=Math.floor(v/7)+2;r-=(25*n-10)*n-55;if(v>=7)r-=36}return r};
 let ver=1;for(;ver<=10;ver++){const cap=Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver];if(4+(ver<10?8:16)+bytes.length*8<=cap*8)break}
 if(ver>10)throw new Error('URL too long');
 const size=ver*4+17,nData=Math.floor(raw(ver)/8)-ECC[ver]*BLK[ver];
 let bits=[];const put=(v,n)=>{for(let i=n-1;i>=0;i--)bits.push((v>>>i)&1)};
 put(4,4);put(bytes.length,ver<10?8:16);bytes.forEach(b=>put(b,8));
 put(0,Math.min(4,nData*8-bits.length));while(bits.length%8)bits.push(0);
 const data=[];for(let i=0;i<bits.length;i+=8)data.push(parseInt(bits.slice(i,i+8).join(''),2));
 for(let p=0xEC;data.length<nData;p^=0xEC^0x11)data.push(p);
 const mul=(x,y)=>{let z=0;for(let i=7;i>=0;i--){z=(z<<1)^((z>>>7)*0x11D);z^=((y>>>i)&1)*x}return z};
 const deg=ECC[ver],div=Array(deg).fill(0);div[deg-1]=1;
 for(let i=0,root=1;i<deg;i++){for(let j=0;j<deg;j++){div[j]=mul(div[j],root);if(j+1<deg)div[j]^=div[j+1]}root=mul(root,2)}
 const rem=d=>{const r=Array(deg).fill(0);d.forEach(b=>{const f=b^r.shift();r.push(0);div.forEach((c,i)=>r[i]^=mul(c,f))});return r};
 const nb=BLK[ver],rc=Math.floor(raw(ver)/8),ns=nb-rc%nb,sl=Math.floor(rc/nb),blocks=[];
 for(let i=0,k=0;i<nb;i++){const d=data.slice(k,k+sl-deg+(i<ns?0:1));k+=d.length;const e=rem(d);if(i<ns)d.push(0);blocks.push(d.concat(e))}
 const cw=[];for(let i=0;i<blocks[0].length;i++)blocks.forEach((b,j)=>{if(i!=sl-deg||j>=ns)cw.push(b[i])});
 const M=Array.from({length:size},()=>Array(size).fill(false)),F=Array.from({length:size},()=>Array(size).fill(false));
 const sf=(x,y,v)=>{M[y][x]=v;F[y][x]=true},bit=(v,i)=>((v>>>i)&1)!=0;
 for(let i=0;i<size;i++){sf(6,i,i%2==0);sf(i,6,i%2==0)}
 const fin=(x,y)=>{for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){const d=Math.max(Math.abs(dx),Math.abs(dy)),xx=x+dx,yy=y+dy;if(xx>=0&&xx<size&&yy>=0&&yy<size)sf(xx,yy,d!=2&&d!=4)}};
 fin(3,3);fin(size-4,3);fin(3,size-4);
 if(ver>1){const n=Math.floor(ver/7)+2,st=Math.ceil((ver*4+4)/(n*2-2))*2,pos=[6];for(let p=size-7;pos.length<n;p-=st)pos.splice(1,0,p);
  pos.forEach((a,i)=>pos.forEach((b,j)=>{if((i==0&&j==0)||(i==0&&j==n-1)||(i==n-1&&j==0))return;for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++)sf(a+dx,b+dy,Math.max(Math.abs(dx),Math.abs(dy))!=1)}))}
 const fmt=m=>{const d=0<<3|m;let r=d;for(let i=0;i<10;i++)r=(r<<1)^((r>>>9)*0x537);const b=(d<<10|r)^0x5412;
  for(let i=0;i<=5;i++)sf(8,i,bit(b,i));sf(8,7,bit(b,6));sf(8,8,bit(b,7));sf(7,8,bit(b,8));for(let i=9;i<15;i++)sf(14-i,8,bit(b,i));
  for(let i=0;i<8;i++)sf(size-1-i,8,bit(b,i));for(let i=8;i<15;i++)sf(8,size-15+i,bit(b,i));sf(8,size-8,true)};
 fmt(0);
 if(ver>=7){let r=ver;for(let i=0;i<12;i++)r=(r<<1)^((r>>>11)*0x1F25);const b=ver<<12|r;for(let i=0;i<18;i++){const c=bit(b,i),a=size-11+i%3,q=Math.floor(i/3);sf(a,q,c);sf(q,a,c)}}
 let i=0;for(let right=size-1;right>=1;right-=2){if(right==6)right=5;for(let v=0;v<size;v++)for(let j=0;j<2;j++){const x=right-j,y=((right+1)&2)==0?size-1-v:v;if(!F[y][x]&&i<cw.length*8){M[y][x]=bit(cw[i>>>3],7-(i&7));i++}}}
 const cond=[(x,y)=>(x+y)%2==0,(x,y)=>y%2==0,(x,y)=>x%3==0,(x,y)=>(x+y)%3==0,(x,y)=>(Math.floor(x/3)+Math.floor(y/2))%2==0,(x,y)=>x*y%2+x*y%3==0,(x,y)=>(x*y%2+x*y%3)%2==0,(x,y)=>((x+y)%2+x*y%3)%2==0];
 const mk=m=>{const g=M.map(r=>r.slice());for(let y=0;y<size;y++)for(let x=0;x<size;x++)if(!F[y][x]&&cond[m](x,y))g[y][x]=!g[y][x];return g};
 const pen=g=>{let p=0;const run=l=>{let c=1;for(let k=1;k<=size;k++){if(k<size&&l[k]==l[k-1])c++;else{if(c>=5)p+=c-2;c=1}}};
  for(let y=0;y<size;y++){run(g[y]);run(g.map(r=>r[y]))}
  for(let y=0;y<size-1;y++)for(let x=0;x<size-1;x++)if(g[y][x]==g[y][x+1]&&g[y][x]==g[y+1][x]&&g[y][x]==g[y+1][x+1])p+=3;
  let d=0;g.forEach(r=>r.forEach(v=>d+=v));p+=Math.floor(Math.abs(d*20-size*size*10)/(size*size))*10;return p};
 let best=0,bp=1e9;for(let m=0;m<8;m++){const p=pen(mk(m));if(p<bp){bp=p;best=m}}
 fmt(best);const g=mk(best);
 let path='';g.forEach((r,y)=>r.forEach((v,x)=>{if(v)path+=`M${x+4},${y+4}h1v1h-1z`}));
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${size+8} ${size+8}" shape-rendering="crispEdges"><rect width="100%" height="100%" fill="#fff"/><path d="${path}" fill="#000"/></svg>`;
}
</script>

function initDB(cb){
  if(FIREBASE_CONFIG){
    const base='https://www.gstatic.com/firebasejs/10.12.2/';
    const load=u=>new Promise((ok,ko)=>{const s=document.createElement('script');s.src=base+u;s.onload=ok;s.onerror=ko;document.head.append(s)});
    load('firebase-app-compat.js').then(()=>load('firebase-database-compat.js')).then(()=>{
      firebase.initializeApp(FIREBASE_CONFIG);const d=firebase.database(),root=d.ref('rooms/'+ROOM);
      d.ref('.info/serverTimeOffset').on('value',s=>offset=s.val()||0);
      const W=pr=>pr.catch(e=>{const m='⚠ Lỗi ghi Firebase: '+(e&&e.message||e);console.error(m);let t=document.getElementById('dberr');if(!t){t=document.createElement('div');t.id='dberr';t.style.cssText='position:fixed;left:8px;right:8px;bottom:8px;z-index:99;background:#b00020;color:#fff;font:600 13px sans-serif;padding:10px 14px;border-radius:10px';document.body.append(t)}t.textContent=m;throw e});
      DB={mode:'firebase',set:(p,v)=>W(root.child(p).set(v)),update:(p,v)=>W(root.child(p).update(v)),
        reset:()=>W(root.set({rid:Date.now()})),
        on:(p,f)=>{const r=root.child(p),h=s=>f(s.val());r.on('value',h);return()=>r.off('value',h)}};
      cb()}).catch(()=>{document.body.innerHTML='<p style="padding:30px;font:18px sans-serif">Không kết nối được Firebase. Kiểm tra mạng và cấu hình.</p>'});
  }else{
    const KEY='dy_demo_'+ROOM;let data={},L=[];try{data=JSON.parse(localStorage[KEY]||'{}')}catch(e){}
    const res=v=>{if(v&&typeof v=='object'){if(v['.sv']=='timestamp')return Date.now();for(const k in v)v[k]=res(v[k])}return v};
    const at=p=>p.split('/').filter(Boolean).reduce((o,k)=>o==null?o:o[k],data);
    const setAt=(p,v)=>{const ks=p.split('/').filter(Boolean);if(!ks.length){data=v||{};return}let o=data;ks.slice(0,-1).forEach(k=>o=o[k]=o[k]&&typeof o[k]=='object'?o[k]:{});if(v==null)delete o[ks.at(-1)];else o[ks.at(-1)]=v};
    const fire=()=>L.forEach(l=>{const j=JSON.stringify(at(l.p)??null);if(j!==l.j){l.j=j;l.f(JSON.parse(j))}});
    const save=()=>{try{localStorage[KEY]=JSON.stringify(data)}catch(e){}fire()};
    addEventListener('storage',e=>{if(e.key==KEY){try{data=JSON.parse(e.newValue||'{}')}catch(x){data={}}fire()}});
    DB={mode:'demo',set:(p,v)=>{setAt(p,res(JSON.parse(JSON.stringify(v??null))));save();return Promise.resolve()},
      update:(p,v)=>{v=res(JSON.parse(JSON.stringify(v)));for(const k in v)setAt(p+'/'+k,v[k]);save();return Promise.resolve()},
      reset:()=>{data={rid:Date.now()};save();return Promise.resolve()},
      on:(p,f)=>{const l={p,f,j:undefined};L.push(l);setTimeout(()=>{const j=JSON.stringify(at(p)??null);l.j=j;f(JSON.parse(j))});return()=>{L=L.filter(x=>x!==l)}}};
    cb();
  }
}

  document.addEventListener('keydown',e=>{
    if(e.target.tagName=='INPUT')return;const k=e.key;
    if(document.getElementById('rulesov')&&(k==' '||k=='Enter'||k=='Escape'||k=='l'||k=='L')){e.preventDefault();rulesToggle();return}
    if(k=='l'||k=='L'){rulesToggle();return}
    if(k==' '||k=='Enter'||k=='ArrowRight'){e.preventDefault();adv()}
    else if(k=='f'||k=='F')l50();else if(k=='a'||k=='A')lau();else if(k=='c'||k=='C')lca();
    else if(k=='q'||k=='Q')bet('M');else if(k=='w'||k=='W')bet('F');else if(k=='b'||k=='B')addBots();else if(k=='End')toFinal();else if(k=='r'||k=='R')reset();
  });
  render();
}

/* =====================================================================
   TRANG ĐIỆN THOẠI KHÁCH
   ===================================================================== */
function player(){
  const MEK='dy_me'+(P.get('as')||'');const app=$('#app');let me;try{me=JSON.parse(localStorage[MEK]||'null')}catch(e){}
  let curRid=null;DB.on('rid',v=>{curRid=v;if(me&&v!=null){if(me.rid==null){me.rid=v;try{localStorage[MEK]=JSON.stringify(me)}catch(e){}}else if(me.rid!==v){me=null;try{localStorage.removeItem(MEK)}catch(e){}wm=0;teamSel=avSel=null;my=null;myTs=null;render()}}});
  let S={phase:'lobby'},my=null,myTs=null,off=null,teamSel=null,avSel=null,sc={M:0,F:0},cdI=0,mst=null,offSt=null,lastQ=-9,wm=0;
  DB.on('state',v=>{const p=S;S=v||{phase:'lobby'};
    if(S.qi!==p.qi||(S.phase=='q'&&p.phase!='q')){my=null;myTs=null;off&&off();off=null;if(me&&S.qi>=0)off=DB.on('answers/'+S.qi+'/'+me.pid,a=>{if(a&&a.ts){myTs=a.ts;if(my==null)my=a.o;if(S.phase=='reveal')render()}})}
    if(S.phase=='q'&&p.phase!='q'&&navigator.vibrate)navigator.vibrate(40);
    if(S.scores)sc={M:S.scores.M||0,F:S.scores.F||0};
    render()});
  function watchMe(){if(wm||!me)return;wm=1;
    DB.on('players/'+me.pid,v=>{if(!v&&me)DB.set('players/'+me.pid,{name:me.name,team:me.team,av:me.av,t:TS})});
    DB.on('stats/'+me.pid,v=>{mst=v;if(S.phase=='reveal'||S.phase=='final')render()})}
  const tugR=()=>{const t=sc.M+sc.F;return t?sc.M/t*100:50};
  const bar=()=>`<div class="pt"><span class="who ${TEAM[me.team].c}"><i>${me.av||'🙂'}</i>${esc(me.name)}</span><span class="sc2"><span class="m">💙 ${fmt(sc.M)}</span><span class="f">💖 ${fmt(sc.F)}</span></span></div><div class="ptug"><i style="width:${tugR()}%"></i></div>`;
  function join(){
    if(me&&me.team&&!teamSel)teamSel=me.team;
    app.innerHTML=`<div class="p"><div class="pc2" style="gap:10px"><div style="text-align:center;font-size:40px">💍</div><h1>AI LÀ TRIỆU PHÚ<small style="font-family:var(--sa);font-size:13px;color:var(--mu);-webkit-text-fill-color:var(--mu)">Đức ♥ Yến · 大富豪</small></h1>
      <input class="inp" id="nm" maxlength="14" placeholder="Tên của bạn · お名前" autocomplete="off" value="${esc(me&&me.name||'')}">
      <div class="avs">${AVS.map(a=>`<button class="avb ${avSel==a?'on':''}" data-a="${a}">${a}</button>`).join('')}</div>
      <div class="tb"><button class="tbn m ${teamSel=='M'?'on':''}" data-t="M">💙 Đội Nam<br><small>男性チーム</small></button><button class="tbn f ${teamSel=='F'?'on':''}" data-t="F">💖 Đội Nữ<br><small>女性チーム</small></button></div>
      <button class="go2" id="go" disabled>Vào chơi · 参加する</button></div></div>`;
    const nm=$('#nm'),go=$('#go'),chk=()=>go.disabled=!(nm.value.trim()&&teamSel&&avSel);nm.oninput=chk;chk();
    document.querySelectorAll('.avb').forEach(b=>b.onclick=()=>{avSel=b.dataset.a;document.querySelectorAll('.avb').forEach(x=>x.classList.toggle('on',x===b));chk()});
    document.querySelectorAll('.tbn').forEach(b=>b.onclick=()=>{teamSel=b.dataset.t;document.querySelectorAll('.tbn').forEach(x=>x.classList.toggle('on',x===b));chk()});
    go.onclick=()=>{const pid=(me&&me.pid)||('p'+Math.random().toString(36).slice(2,9));me={pid,name:nm.value.trim().slice(0,14),team:teamSel,av:avSel,rid:curRid??0};try{localStorage[MEK]=JSON.stringify(me)}catch(e){}
      DB.set('players/'+pid,{name:me.name,team:me.team,av:me.av,t:TS});
      if(S.qi!=null&&S.qi>=0&&off==null)off=DB.on('answers/'+S.qi+'/'+pid,a=>{if(a&&a.ts){myTs=a.ts;if(my==null)my=a.o}});
      watchMe();render()};
  }
  function ring(left,dur){const lo=left<=5;return`<div class="pring ${lo?'lo':''}"><svg viewBox="0 0 100 100"><circle class="t" cx="50" cy="50" r="46"/><circle class="p" cx="50" cy="50" r="46" style="stroke-dashoffset:${289*(1-left/dur)}"/></svg><b>${Math.ceil(left)}</b></div>`}
  function render(){
    clearInterval(cdI);
    if(!me||!me.av){join();return}
    const ph=S.phase;
    if(ph=='lobby'||S.qi==null||S.qi<0){app.innerHTML=`<div class="p">${bar()}<div class="pc2"><div class="avbig">${me.av}</div><h2>Đã vào phòng!<small style="font-family:var(--sa);font-size:13px;color:var(--mu)">参加完了！</small></h2><p>Chào <b class="gold">${esc(me.name)}</b> · ${TEAM[me.team].ic} ${TEAM[me.team].n}<br>Chờ MC bắt đầu nhé. Hãy nhìn lên màn hình lớn 👀</p><details class="prules"><summary>📖 Xem luật chơi</summary>${rulesHTML('rp')}</details></div></div>`;return}
    if(ph=='final'){const s=sc,w=s.M==s.F?null:s.M>s.F?'M':'F',mine=w&&w==me.team;
      app.innerHTML=`<div class="p">${bar()}<div class="pc2"><div style="text-align:center;font-size:70px">${w?(mine?'🏆':'🎖️'):'🤝'}</div><h1>${w?`${TEAM[w].n} chiến thắng!`:'Hai đội hòa nhau!'}</h1>
      <div class="rb ${mine?'me':''}"><b>💙 ${fmt(s.M)} · 💖 ${fmt(s.F)}</b><span>${mine?'Đội của bạn là TRIỆU PHÚ! 🎉':'Cảm ơn bạn đã chơi cùng Đức & Yến ♥'}</span></div>
      ${mst?`<div class="pst"><div class="glass"><b>#${mst.r}</b>Hạng cá nhân</div><div class="glass"><b>${mst.c}</b>Câu đúng</div><div class="glass"><b>${mst.w}</b>Nhanh nhất</div></div>`:''}</div></div>`;
      if(mine)confetti(160);return}
    if(!(S.text&&S.opts))return;
    const opts=arr(S.opts).map(o=>arr(o)),hid=arr(S.hide),txt=arr(S.text);
    const head=left=>`<div class="pm"><span>Câu ${S.qi+1}/${S.n} · 💰 ${fmt(S.pts)}${S.bet?` · 🎲 ${TEAM[S.bet].n} cược!`:''}</span>${left==null?'':ring(left,S.dur)}</div><div class="pq">${esc(txt[0])}${txt[1]?`<small>${esc(txt[1])}</small>`:''}</div>`;
    const btns=cls=>opts.map((o,i)=>`<button class="pb ${hid.includes(i)?'hide':''} ${cls(i)}" data-o="${i}"><b>${'ABCD'[i]}</b><span>${esc(o[0])}${o[1]?`<small style="display:block;color:var(--mu)">${esc(o[1])}</small>`:''}</span></button>`).join('');
    if(ph=='q'){
      const left0=Math.max(0,S.dur-(now()-S.startTs)/1000);
      app.innerHTML=`<div class="p">${bar()}${head(left0)}<div class="po">${btns(i=>my==null?'':(my===i?'sel off':'off'))}</div><p style="text-align:center;font-size:14px;color:var(--mu);min-height:1.4em" id="pst">${my==null?'Chạm vào đáp án thật nhanh! ⚡':'✅ Đã chốt! Chờ kết quả…'}</p></div>`;
      document.querySelectorAll('.pb').forEach(b=>b.onclick=()=>{if(my!=null||S.phase!='q')return;const o=+b.dataset.o;my=o;myTs=Date.now();navigator.vibrate&&navigator.vibrate(30);
        DB.set('answers/'+S.qi+'/'+me.pid,{o,ts:TS});document.querySelectorAll('.pb').forEach(x=>x.classList.add('off'));b.classList.add('sel');$('#pst').textContent='✅ Đã chốt! Chờ kết quả…'});
      const t=()=>{const l=Math.max(0,S.dur-(now()-S.startTs)/1000);const pr=$('.pring');if(!pr)return;pr.classList.toggle('lo',l<=5);pr.querySelector('.p').style.strokeDashoffset=289*(1-l/S.dur);pr.querySelector('b').textContent=Math.ceil(l);const cc=Math.ceil(l);if(cc<=3&&cc>0&&window._lc!==cc){window._lc=cc;navigator.vibrate&&navigator.vibrate([60,60,60])}};t();cdI=setInterval(t,250);return}
    if(ph=='locked'){app.innerHTML=`<div class="p">${bar()}${head(null)}<div class="po">${btns(i=>my===i?'sel off':'off')}</div><p style="text-align:center;color:var(--gold);font-weight:800">${my==null?'⏰ Hết giờ rồi!':'🔒 Đã khóa · Love Bot sắp lộ đáp án…'}</p></div>`;return}
    if(ph=='reveal'){
      const c=S.correct,right=my!=null&&my===c,w=S.winner,iAmW=w&&w.pid==me.pid,ms=(myTs&&S.startTs)?Math.max(0,myTs-S.startTs)/1000:null;
      const tw=w?TEAM[w.team]:null;
      app.innerHTML=`<div class="p">${bar()}${head(null)}<div class="po" style="grid-auto-rows:minmax(44px,auto)">${btns(i=>i===c?'ok off':(my===i?'no off':'off'))}</div>
        <div class="rb ${iAmW?'me':right?'ok':'no'}">${iAmW?`<b>🏆 BẠN NHANH NHẤT! +${fmt(S.gain??S.pts)}</b><span>${ms!=null?ms.toFixed(2)+' giây · ':''}điểm về ${TEAM[me.team].n}</span>`:right?`<b>🎉 Đúng rồi!</b><span>${ms!=null?ms.toFixed(2)+' giây':''}${w?` · nhanh nhất là ${esc(w.name)}`:''}</span>`:`<b>${my==null?'⏰ Không kịp trả lời':'😅 Sai rồi!'}</b><span>${w?`Nhanh nhất: ${esc(w.name)} ${tw.ic} (${(w.ms/1000).toFixed(2)}s)`:'Không ai đúng câu này'}</span>`}</div>
        ${mst?`<div class="pst"><div class="glass"><b>${mst.st>=2?'🔥':''}${mst.st}</b>Chuỗi đúng</div><div class="glass"><b>${mst.c}</b>Câu đúng</div><div class="glass"><b>#${mst.tr||'-'}</b>Hạng đội</div></div>`:''}
        ${S.bot?`<div class="pbot glass"><i>🤖</i><div><small>LOVE BOT</small>${esc(S.bot)}</div></div>`:''}</div>`;
      if(iAmW){confetti(120,innerWidth/2,innerHeight*.5);navigator.vibrate&&navigator.vibrate([60,40,60])}
      else if(right){confetti(40,innerWidth/2,innerHeight*.55)}
      return}
  }
  if(me)watchMe();
  render();
}

initDB(()=>HOST?host():player());
</script>
